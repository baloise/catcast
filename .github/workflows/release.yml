name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            ext: .exe
          - os: ubuntu-latest
            suffix: linux-x64
            ext: ""
          - os: macos-latest
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Exposed at job level so the signing step's `if` can test it — the
      # `secrets` context is not available in step `if` conditions.
      SIGNING_KEY: ${{ secrets.CATCAST_RELEASE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A hung Ubuntu mirror once held both Linux jobs in `apt-get update`
      # for 30+ minutes: time each attempt out, retry, and cap the step.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do timeout 240 sudo apt-get $apt update && break; [ $i = 3 ] && exit 1; sleep 10; done
          sudo apt-get $apt install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - name: Build binaries
        run: cargo build --release -p catstage -p catc
      # The Tauri CLI comes prebuilt from npm: `cargo install tauri-cli`
      # compiled it for ~7 min. Keep the `cargo build` above: `tauri build`
      # reuses it and only rebuilds the top of catstage (~2 min); without it
      # the whole catstage tree builds here (~8 min).
      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npx --yes @tauri-apps/cli@2.11.1 build --bundles msi
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/catstage${{ matrix.ext }}" "dist/catstage-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/release/catc${{ matrix.ext }}"     "dist/catc-${{ matrix.suffix }}${{ matrix.ext }}"
          # Per-asset checksum sidecars in `sha256sum` format. `catc stage
          # update` pins the hash from here into the update command, so a
          # stage only swaps in exactly what CI built.
          cd dist
          for f in catstage-* catc-*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
      - name: Sign binaries (Ed25519)
        if: env.SIGNING_KEY != ''
        shell: bash
        run: |
          # Detached raw-Ed25519 signature over each binary, hex-encoded into
          # a `.sig` sidecar. catstage/catc verify it against the key compiled
          # into catcast-net (sign::RELEASE_PUBKEY) before installing an
          # update. Keep the PEM out of the workspace; RUNNER_TEMP is cleaned.
          pem="$RUNNER_TEMP/release.pem"
          printf '%s' "$SIGNING_KEY" > "$pem"
          cd dist
          for f in catstage-* catc-*; do
            case "$f" in *.sha256|*.sig) continue;; esac
            openssl pkeyutl -sign -inkey "$pem" -rawin -in "$f" -out "$RUNNER_TEMP/sig.bin"
            od -An -v -tx1 "$RUNNER_TEMP/sig.bin" | tr -d ' \n' > "$f.sig"
          done
          rm -f "$pem" "$RUNNER_TEMP/sig.bin"
      - name: Stage MSI artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp target/release/bundle/msi/*.msi dist/
      - uses: actions/upload-artifact@v4
        with:
          name: catcast-${{ matrix.suffix }}
          path: dist/
      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/catstage-${{ matrix.suffix }}${{ matrix.ext }}
            dist/catc-${{ matrix.suffix }}${{ matrix.ext }}
            dist/*.sha256
            dist/*.sig
          generate_release_notes: true
      - name: Attach MSI to GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: false
