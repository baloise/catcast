name: ci

on:
  push:
    branches: [main]
    # Docs-only pushes skip the build matrix. Not on pull_request: a
    # required check that never starts would block the PR.
    paths-ignore: ["**.md", "docs/**", "LICENSE", "*.svg"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # A hung Ubuntu mirror once held both Linux jobs in `apt-get update`
      # for 30+ minutes: time each attempt out, retry, and cap the step.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do timeout 240 sudo apt-get $apt update && break; [ $i = 3 ] && exit 1; sleep 10; done
          sudo apt-get $apt install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  catproxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/catproxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests import only the worker's own sources; nothing to install.
      - run: npm test
