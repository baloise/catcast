name: socks-deploy

on:
  push:
    branches: [main]
    paths:
      - "crates/catsocks/**"
      - "crates/catcast-proto/**"
      - "crates/catcast-core/**"
      - ".github/workflows/socks-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # worker-build is installed by the [build] command in wrangler.toml,
      # pinned to the locked `worker` version. Don't install it here too: an
      # unpinned install pulls the newest release, which rejects the locked
      # wasm-bindgen.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crates/catsocks
