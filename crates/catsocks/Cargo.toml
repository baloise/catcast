[package]
name = "catsocks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CatCast WebSocket relay — Cloudflare Worker (Rust/WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

# Two flavours:
#
# - **WASM (production)**: `wasm32-unknown-unknown` + the Cloudflare `worker`
#   crate. Deployed to Cloudflare Workers via `wrangler deploy`.
# - **Native (local dev)**: `catsocks-dev` binary, a tiny axum/tokio relay
#   with the same `/r/<room>` URL scheme. Lets the inner dev loop run
#   without Node or wrangler installed.

[[bin]]
name = "catsocks-dev"
path = "src/bin/dev.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.5", features = ["http"] }
uuid = { version = "1", features = ["v4", "js"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
futures-util = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
clap = { workspace = true }
