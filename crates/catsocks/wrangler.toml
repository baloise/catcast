name = "catsocks"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

# `worker-build` is invoked by `wrangler dev` / `wrangler deploy` to compile
# the crate to WASM and emit a JS shim under `build/`.
#
# Pinned to the `worker` version in Cargo.lock: the two crates are released
# in lockstep, and a newer worker-build refuses an older locked wasm-bindgen
# ("Unsupported version wasm-bindgen@…"). An unpinned `cargo install` also
# upgrades an already-installed copy. When `worker` is bumped, bump this too;
# the `worker_build_matches_locked_worker` test in src/lib.rs enforces it.
[build]
command = "cargo install -q --locked worker-build --version 0.8.3 && worker-build --release"

# One Durable Object class per room.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Hibernatable WebSockets need a stateful migration that registers `Room`
# as a Durable Object class. Bumping this `tag` after a schema change is
# how Cloudflare tracks DO migrations.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
