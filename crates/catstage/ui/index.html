<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>catcast://about</title>
    <!--
      Console + error forwarding shim. Wraps console.log/info/warn/error/debug
      to also invoke cmd_log on the Rust side, and captures uncaught errors
      and unhandled promise rejections. Runs before any other script so it
      catches load-time errors. Failures swallow silently — DevTools still
      shows everything regardless.
    -->
    <script>
      (function () {
        const safeInvoke = (cmd, args) => {
          try {
            const t = window.__TAURI__ || {};
            const inv = (t.core && t.core.invoke) || t.invoke;
            if (typeof inv === "function") {
              const r = inv(cmd, args);
              if (r && typeof r.catch === "function") r.catch(() => {});
            }
          } catch (_) {}
        };
        const fmt = (a) => {
          if (a instanceof Error) return a.stack || a.message;
          if (a && typeof a === "object") {
            try { return JSON.stringify(a); } catch (_) { return String(a); }
          }
          return String(a);
        };
        ["log", "info", "warn", "error", "debug"].forEach((level) => {
          const orig = console[level].bind(console);
          console[level] = (...args) => {
            orig(...args);
            try {
              safeInvoke("cmd_log", { level, msg: args.map(fmt).join(" ") });
            } catch (_) {}
          };
        });
        window.addEventListener("error", (e) => {
          console.error(
            "uncaught:",
            e.message,
            "at",
            (e.filename || "?") + ":" + (e.lineno || 0) + ":" + (e.colno || 0),
          );
        });
        window.addEventListener("unhandledrejection", (e) => {
          console.error("unhandled rejection:", fmt(e.reason));
        });
        setTimeout(() => {
          const t = window.__TAURI__;
          if (!t) {
            console.error("window.__TAURI__ is missing — IPC bridge not injected");
          } else {
            console.log("bridge ready, keys:", Object.keys(t).join(","));
          }
        }, 0);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b22;
        --line: #2a313a;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --ok: #3fb950;
        --warn: #d29922;
        --err: #f85149;
        --font: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg); color: var(--text);
        font-family: var(--font); font-size: 14px;
        min-height: 100vh;
      }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
      }
      header .title { display: flex; align-items: center; gap: 14px; }
      header .logo {
        flex: 0 0 auto;
        display: inline-flex; align-items: center; justify-content: center;
        width: 72px; height: 72px; padding: 8px;
        background: radial-gradient(circle, #e2e2e2 0%, #000000 100%);
        border-radius: 50%;
      }
      header .logo svg { width: 100%; height: 100%; display: block; }
      header h1 { margin: 0; font-size: 28px; font-weight: 600; }
      header .meta { color: var(--muted); font-size: 13px; }
      header .broker { display: flex; align-items: center; gap: 8px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
      .dot.up { background: var(--ok); }
      .dot.down { background: var(--err); }
      section {
        margin-top: 20px; padding: 16px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      }
      section h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
      .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
      .row + .row { border-top: 1px dashed var(--line); }
      .row code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); }
      .row .label { width: 130px; color: var(--muted); }
      .check { width: 18px; text-align: center; }
      .check.yes { color: var(--ok); }
      .check.no { color: var(--err); }
      .hints { color: var(--muted); font-size: 13px; }
      .hints kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #21262d; border: 1px solid var(--line); padding: 2px 6px;
        border-radius: 3px; font-size: 12px;
      }
      .status-grid { display: grid; grid-template-columns: 130px 1fr; gap: 8px 16px; }
      .status-grid .k { color: var(--muted); }
      .pill {
        display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px;
        background: #21262d; border: 1px solid var(--line);
      }
      .pill.paused { color: var(--warn); border-color: var(--warn); }
      .pill.playing { color: var(--ok); border-color: var(--ok); }
      .pill.idle { color: var(--muted); border-color: var(--muted); }
      .autostart-state { color: var(--muted); }
      .autostart-state.installed { color: var(--ok); }
      .autostart-state.missing { color: var(--warn); }
    </style>
  </head>

          <div>
            <h1 id="stage-name">…</h1>
            <div class="meta">
              CatCast <span id="version">…</span>
            </div>
          </div>
        </div>
        <div class="broker">
          <span class="dot" id="conn-dot"></span>
          <code id="broker-url">…</code>
        </div>
      </header>

      <section>
        <h2>Status</h2>
        <div class="status-grid">
          <div class="k">Mode</div><div><span id="mode-pill" class="pill">…</span></div>
          <div class="k">Current URL</div><div><code id="current-url">—</code></div>
          <div class="k">Has config</div><div id="has-config">—</div>
          <div class="k">Has logic</div><div id="has-logic">—</div>
          <div class="k">Since</div><div id="since">—</div>
        </div>
      </section>

      <section>
        <h2>Files</h2>
        <div id="files"></div>
      </section>

      <section>
        <h2>Autostart</h2>
        <div id="autostart" class="autostart-state">…</div>
      </section>

      <section class="hints">
        Shortcut: <kbd>F1</kbd> back to about (from any page). Everything
        else — pause, play, manual on/off, nav, config import, autostart
        install/uninstall, fullscreen, devtools, shutdown — is a
        <code>catc</code> command.
      </section>
    </div>

    <script>
      (function () {
        const tauri = window.__TAURI__ || {};
        const invoke =
          (tauri.core && tauri.core.invoke) || tauri.invoke ||
          (() => Promise.reject(new Error("Tauri bridge not available")));
        const listen =
          (tauri.event && tauri.event.listen) ||
          (() => Promise.resolve(() => {}));

        const initial = window.__CATCAST__ || {};

        function fmtSince(ms) {
          if (!ms) return "—";
          try { return new Date(ms).toLocaleString(); } catch (_) { return String(ms); }
        }

        function render(snap) {
          document.getElementById("stage-name").textContent = snap.state.name || "(unnamed)";
          document.getElementById("version").textContent = "v" + (snap.state.version || "?");
          document.getElementById("broker-url").textContent = snap.broker_url || "(no broker)";
          const dot = document.getElementById("conn-dot");
          dot.classList.remove("up", "down");
          if (snap.connection === "up") dot.classList.add("up");
          else if (snap.connection === "down") dot.classList.add("down");

          const pill = document.getElementById("mode-pill");
          pill.classList.remove("paused", "playing", "idle");
          // snap.state.mode is "playing" | "paused" | "idle" (catcast_core::Mode).
          // Stages booting without config/logic stay idle until something is pushed.
          const mode = snap.state.mode || "playing";
          const text =
            mode === "idle" ? (snap.state.has_config && snap.state.has_logic ? "Idle" : "Idle (waiting for config)") :
            mode === "paused" ? "Paused" :
            "Playing";
          pill.classList.add(mode);
          pill.textContent = text;

          document.getElementById("current-url").textContent = snap.state.current_url || "—";
          document.getElementById("has-config").textContent = snap.state.has_config ? "yes" : "no";
          document.getElementById("has-logic").textContent = snap.state.has_logic ? "yes" : "no";
          document.getElementById("since").textContent = fmtSince(snap.state.since);

          const files = document.getElementById("files");
          files.innerHTML = "";
          (snap.files || []).forEach((f) => {
            const row = document.createElement("div");
            row.className = "row";
            const check = document.createElement("span");
            check.className = "check " + (f.exists ? "yes" : "no");
            check.textContent = f.exists ? "✓" : "✗";
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = f.label;
            const path = document.createElement("code");
            path.style.flex = "1";
            path.style.overflow = "hidden";
            path.style.textOverflow = "ellipsis";
            path.textContent = f.path || "(unavailable)";
            row.append(check, label, path);
            files.appendChild(row);
          });

          const auto = document.getElementById("autostart");
          auto.classList.remove("installed", "missing");
          if (snap.autostart_path) {
            auto.classList.add("installed");
            auto.innerHTML = "";
            const row = document.createElement("div");
            row.className = "row";
            row.innerHTML =
              `<span class="check yes">✓</span>` +
              `<span class="label">Installed</span>` +
              `<code style="flex:1">${snap.autostart_path}</code>`;
            auto.appendChild(row);
          } else {
            auto.classList.add("missing");
            auto.textContent =
              "Not installed. Run `catc autostart install --name " +
              (snap.state.name || "<name>") + "` to set up auto-launch at login.";
          }
        }

        function refresh() {
          return invoke("get_snapshot").then(render).catch((e) => console.error(e));
        }

        // Live updates pushed by Rust on scheduler / connection events.
        listen("catcast://state", (ev) => {
          if (ev && ev.payload) render(ev.payload);
        });
        listen("catcast://connection", () => refresh());

        if (initial.state) render(initial);
        refresh();
        // Being on the about page implies Idle — assert it so F1 from a
        // rotation URL pauses the scheduler too, not just navigates.
        invoke("enter_idle").catch((e) => console.error(e));
      })();
    </script>
  </body>
