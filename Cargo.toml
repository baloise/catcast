[workspace]
resolver = "2"
members = [
    "crates/catcast-core",
    "crates/catcast-proto",
    "crates/catc",
    "crates/catstage",
    "crates/catsocks",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "0BSD"
repository = "https://github.com/baloise/catcast"
rust-version = "1.82"

[workspace.dependencies]
catcast-core = { path = "crates/catcast-core" }
catcast-proto = { path = "crates/catcast-proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"

# crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"

# async / ws
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.9"
directories = "6"
humantime = "2"

[workspace.metadata.release]
shared-version             = true
consolidate-commits        = true
tag-name                   = "v{{version}}"
publish                    = false
allow-branch               = ["main"]
pre-release-commit-message = "release {{version}}"
tag-message                = "v{{version}}"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Zscaler in our dev environment blocks several crates.io downloads as
# false positives. These patches route around them while CI / Windows
# stage boxes (which don't sit behind Zscaler) get the upstream crates.
# Drop these patches once the affected crates are allowlisted by IT.
[patch.crates-io]
# `cfb` is pulled in transitively via `infer` → `tauri-utils`. The OLE
# Compound File Binary format trips Zscaler. vendor/cfb-stub is a no-op
# shim — see its README.
cfb = { path = "vendor/cfb-stub" }
# `libloading` is pulled in by Tauri (Wry's webkit interop). Git source
# matches version 0.7.4 exactly via tag.
libloading = { git = "https://github.com/nagisa/rust_libloading.git", tag = "0.7.4" }
