[workspace]
resolver = "2"
members = [
    "crates/catcast-core",
    "crates/catcast-proto",
    "crates/catc",
    "crates/catstage",
    "crates/catsocks",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "0BSD"
repository = "https://github.com/baloise/catcast"
rust-version = "1.82"

[workspace.dependencies]
catcast-core = { path = "crates/catcast-core" }
catcast-proto = { path = "crates/catcast-proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"

# crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"

# async / ws
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.9"
directories = "6"
humantime = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
